<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
  
      }
      .container {
        display: flex;
        gap: 1vw;
        background-color: #f5f0eb;
        height: 100vh;

      }
      .aveon{
        padding: 0.6vw;
      }

      .sidebar {
        width: 40%;
      }
      .sidebar div {
        display: flex;
        width: max-content;
        padding: 10px;
      }
      .sidebar p span {
        display: block;
      }
      .middlenav {
        list-style: none;
        padding: 2vh 0px 0px 0px;
        display: flex;
        flex-direction: column;
        gap: 1.5vw;
      }
      .content {
        height: inherit;
        width: 100%;
        background-image: url(background.png);
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
      }
      .middlenav li a {
        color: black;
        font-weight: bolder;
        font-size: xx-large;
        text-decoration: none;
        transition: all 0.3s ease;
        padding: 1vh;
      }
      .footer {
        padding-top: 15vh;
      }
      .middlenav li a:hover {
        background: linear-gradient(
            115deg,
            #000000 20%,
            #999999 38%,
            #000000 46%,
            #555555 60%,
            #000000 80%
          )
          0 0 / 240% 100%;
        background-clip: text;
        color: transparent;
        animation: nav-sweep 1.6s ease-in-out infinite;
        transform: translateY(-3px);
      }
      .footer{
        padding-left: 1vh;
        padding-top: 27vh;

      }
      .contact{
        word-spacing: 0.2vh;
        letter-spacing: 0.1vh;
        display: flex;
        flex-direction: column;
        gap: 2vh;
        
      }
      .visit{
        word-spacing: 0.2vh;
        letter-spacing: 0.1vh;
        display: flex;
        flex-direction: column;
        gap: 2vh;
      }
      .contact a{
        text-decoration: none;
        color: black;
      }
      .contact a:hover{
        text-decoration: underline;
        color: #000000;
      }
      .bottomnav{
        display: flex;
        flex-direction: column;
        gap: 5vh;
      }

      @keyframes nav-sweep {
        to {
          background-position: 240% 0;
        }

    
      }
    </style>
  </head>
  <body>
    <div class="container">
      <aside>
        <nav class="sidebar">
          <div class="topnav">
            <svg
              class="aveonlogo"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 106 60"
              width="50"
              height="50"
            >
              <polygon points="0,60 20,60 50,0 30,0" fill="#D2B9A6" />
              <polygon points="28,60 48,60 78,0 58,0" fill="#BD9D82" />
              <polygon points="56,60 76,60 106,0 86,0" fill="#A87B57" />
            </svg>
            <p class="aveon">
               AVEON
              <span class="logotext">INTERIOR DESIGN STUDIO-EST.2020</span>
            </p>
          </div>
          <ul class="middlenav">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Work</a></li>
            <li><a href="#">Journal</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Legal</a></li>
          </ul>
        </nav>
        <footer class="footer">
          <div class="bottomnav">
            <div>
            <address class="contact">
              <h4>[CONTACT INFO]</h4>
              <a href="mailto:hello@aveondesign@gmail.com">hello@aveondesign@gmail.com</a>
              <a href="tel:+1 (415) 555-0199">+1 (415) 555-0199</a>
            </address>
            </div>
            <div> 
            <address class="visit">
              <h4>[VISIT US]</h4>
              <p>Visit in San Francisco</p>
              <p>Visit in Brooklyn</p>
            </address>
            <br>
            <br>
            <p>&copy; 2026 AVÉON DESIGN</p>
            </div>
          </div>
        </footer>
      </aside>
      <div class="content">

      </div>
    </div>
  </body>
</html>
