<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Over</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(to bottom, #0b1625 0%, #1b3146 55%, #233b14 75%, #16280b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 20px 45px 20px;
            color: white;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
            line-height: 20px;
            letter-spacing: 1px;
        }

        .cards {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 70px;
            flex-wrap: wrap;
        }

        .card {
            width: 340px;
            height: 310px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 20px;
        }

        .ind {
            background-color: #155799;
        }

        .pak {
            background-color: #499e33;
        }

        .card h1 {
            font-size: 56px;
            font-weight: bold;
        }

        .balls {
            display: flex;
            gap: 10px;
        }

        .ball {
            width: 38px;
            height: 38px;
            background-color: white;
            color: black;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 19px;
            font-weight: bold;
        }

        .score {
            font-size: 42px;
            font-weight: bold;
        }

        .btns {
            display: flex;
            gap: 45px;
        }

        .btn {
            width: 78px;
            height: 78px;
            border-radius: 22px;
            border: 4px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .bat-btn {
            background-color: #f8b739;
        }

        .reset-btn {
            background-color: #e82c2a;
        }

        @media (max-width: 780px) {
            .cards {
                gap: 25px;
                margin: 25px 0;
            }

            .card {
                width: 290px;
                height: 260px;
            }

            .card h1 {
                font-size: 44px;
            }

            .ball {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }

            .score {
                font-size: 34px;
            }
        }
    </style>
</head>
<body>

    <div class="logo">
        <svg width="38" height="38" viewBox="0 0 64 64" fill="white">
            <circle cx="38" cy="14" r="6"/>
            <path d="M24 26 L36 22 L42 36 L34 52 L28 50 L33 37 L24 32 Z"/>
            <rect x="14" y="18" width="5" height="26" transform="rotate(-35 16 30)"/>
            <circle cx="48" cy="48" r="6"/>
        </svg>
        <div class="logo-text">
            <div>SUPER</div>
            <div>OVER</div>
        </div>
    </div>

    <div class="cards">
        <div class="card ind">
            <h1>IND</h1>
            <div class="balls">
                <div class="ball">4</div>
                <div class="ball">3</div>
                <div class="ball">2</div>
                <div class="ball">6</div>
                <div class="ball">6</div>
                <div class="ball">6</div>
            </div>
            <div class="score">27/0</div>
        </div>

        <div class="card pak">
            <h1>PAK</h1>
            <div class="balls">
                <div class="ball">2</div>
                <div class="ball">4</div>
                <div class="ball">0</div>
                <div class="ball">3</div>
                <div class="ball">1</div>
                <div class="ball">4</div>
            </div>
            <div class="score">14/0</div>
        </div>
    </div>

    <div class="btns">
        <div class="btn bat-btn">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="white">
                <path d="M19.5 3.5L20.5 4.5L16.5 8.5L15.5 7.5L19.5 3.5ZM14.5 8.5L15.5 9.5L7.5 17.5C6.7 18.3 5.3 18.3 4.5 17.5C3.7 16.7 3.7 15.3 4.5 14.5L12.5 6.5L13.5 7.5L14.5 8.5Z"/>
            </svg>
        </div>
        <div class="btn reset-btn">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
                <path d="M3 3v5h5"/>
            </svg>
        </div>
    </div>

</body>
</html>
